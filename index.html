<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Moja lista ToDo</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<h1>Lista ToDo</h1>

	<section id="login-section">
		<h2>Logowanie</h2>
		<form id="login-form">
			<label for="login-email">Email:</label>
			<input type="email" id="login-email" name="email" required>

			<label for="login-password">Hasło:</label>
			<input type="password" id="login-password" name="password" required>

			<button type="submit">Zaloguj</button>
			<p id="login-error" role="alert"></p>
		</form>

		<h3>Rejestracja</h3>
		<form id="signup-form">
			<label for="signup-email">Email:</label>
			<input type="email" id="signup-email" name="email" required>

			<label for="signup-password">Hasło:</label>
			<input type="password" id="signup-password" name="password" required>

			<button type="submit">Zarejestruj się</button>
		</form>
		<p id="signup-status" role="status"></p>
	</section>

	<button type="button" id="logout-button" hidden>Wyloguj</button>

	<section id="todo-section" hidden>
		<form id="task-form">
			<label for="new-task">Nowe zadanie:</label>
			<input type="text" id="new-task" name="new-task">
			<button type="submit">Dodaj</button>
		</form>

		<nav class="filters" aria-label="Filtrowanie zadań">
			<button type="button" data-filter="all">Wszystkie</button>
			<button type="button" data-filter="todo">Do zrobienia</button>
			<button type="button" data-filter="completed">Wykonane</button>
		</nav>

		<p id="todo-count">Do zrobienia: 0</p>

		<ul id="task-list">
		</ul>
	</section>

	<script type="module" src="js/app.js"></script>
</body>
</html>
